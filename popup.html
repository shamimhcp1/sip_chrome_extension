<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SIP Phone</title>
    <style>
      body {
        width: 280px;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        font-size: 12px;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      section {
        border-top: 1px solid #e2e2e2;
        padding-top: 10px;
        margin-top: 10px;
      }
      section:first-of-type {
        border-top: none;
        padding-top: 0;
        margin-top: 0;
      }
      label {
        display: block;
        margin-bottom: 6px;
      }
      label span {
        display: block;
        color: #666;
        margin-bottom: 2px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      button {
        flex: 1;
        padding: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      #reg-status {
        font-weight: 600;
      }
      #reg-status.registered {
        color: #1a7f37;
      }
      #reg-status.failed {
        color: #b3261e;
      }
      #call-status {
        margin: 6px 0;
      }
      #account-error {
        color: #b3261e;
        margin-top: 6px;
        word-break: break-word;
      }
      #dtmf-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 6px;
      }
      #dtmf-grid button {
        padding: 4px;
      }
      #attended-transfer-status {
        color: #666;
        margin: 4px 0 0;
      }
      #history-list {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
        max-height: 120px;
        overflow-y: auto;
      }
      #history-list li {
        padding: 3px 0;
        border-bottom: 1px solid #eee;
      }
      #history-list li:last-child {
        border-bottom: none;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>SIP Phone</h1>

    <section id="account-section">
      <label>
        <span>SIP URI (e.g. 1001@pbx.example.com)</span>
        <input id="uri" type="text" autocomplete="off" />
      </label>
      <label>
        <span>Password</span>
        <input id="password" type="password" autocomplete="off" />
      </label>
      <label>
        <span>WSS server (e.g. wss://pbx.example.com:8089/ws)</span>
        <input id="wssServer" type="text" autocomplete="off" />
      </label>
      <label>
        <span>Display name (optional)</span>
        <input id="displayName" type="text" autocomplete="off" />
      </label>
      <label>
        <span>Auth username (optional — only if different from the SIP URI's user part)</span>
        <input id="authUsername" type="text" autocomplete="off" />
      </label>
      <div class="row">
        <button id="save-register">Save &amp; Register</button>
        <button id="unregister">Unregister</button>
      </div>
      <div class="row">
        <button id="request-mic">Enable microphone</button>
      </div>
      <p>Status: <span id="reg-status">unregistered</span></p>
      <p id="account-error"></p>
    </section>

    <section id="dialer-section">
      <label>
        <span>Call target</span>
        <input id="target" type="text" autocomplete="off" placeholder="1002 or 1002@pbx.example.com" />
      </label>
      <div class="row">
        <button id="call">Call</button>
        <button id="hangup">Hangup</button>
      </div>
      <div class="row" id="incoming-row" hidden>
        <button id="answer">Answer</button>
        <button id="reject">Reject</button>
      </div>
      <p id="call-status">No active call</p>
    </section>

    <section id="controls-section">
      <div class="row">
        <button id="mute" disabled>Mute</button>
        <button id="hold" disabled>Hold</button>
      </div>
      <div id="dtmf-grid">
        <button class="dtmf-key" data-tone="1" disabled>1</button>
        <button class="dtmf-key" data-tone="2" disabled>2</button>
        <button class="dtmf-key" data-tone="3" disabled>3</button>
        <button class="dtmf-key" data-tone="4" disabled>4</button>
        <button class="dtmf-key" data-tone="5" disabled>5</button>
        <button class="dtmf-key" data-tone="6" disabled>6</button>
        <button class="dtmf-key" data-tone="7" disabled>7</button>
        <button class="dtmf-key" data-tone="8" disabled>8</button>
        <button class="dtmf-key" data-tone="9" disabled>9</button>
        <button class="dtmf-key" data-tone="*" disabled>*</button>
        <button class="dtmf-key" data-tone="0" disabled>0</button>
        <button class="dtmf-key" data-tone="#" disabled>#</button>
      </div>
      <label>
        <span>Transfer target</span>
        <input id="transfer-target" type="text" autocomplete="off" placeholder="1002 or 1002@pbx.example.com" />
      </label>
      <div class="row">
        <button id="blind-transfer" disabled>Blind transfer</button>
        <button id="attended-transfer-start" disabled>Attended transfer</button>
      </div>
      <div class="row" id="attended-transfer-row" hidden>
        <button id="attended-transfer-complete">Complete</button>
        <button id="attended-transfer-cancel">Cancel</button>
      </div>
      <p id="attended-transfer-status"></p>
    </section>

    <section id="history-section">
      <div class="row">
        <span style="flex: 1; font-weight: 600">Call history</span>
        <button id="history-clear" style="flex: 0 0 auto; padding: 2px 8px">Clear</button>
      </div>
      <ul id="history-list"></ul>
    </section>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
